# SANGAM / GovOrchestrator -- complete stack.
#
# Start order: postgres + redis (healthy) -> migrate (alembic upgrade head,
# runs once and exits) -> department-api (healthy) -> backend + worker ->
# frontend. Only the frontend (and, for diagnostics, the backend API) is
# published on the host; PostgreSQL and Redis stay on the internal network.
#
# Configure everything through .env (copy .env.example). No secret has a
# default here: Compose refuses to start until they are set.

x-backend-env: &backend-env
  SANGAM_ENV: ${SANGAM_ENV:-development}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_ENABLED: ${REDIS_ENABLED:-true}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  ASYNC_PROVIDER_JOBS: ${ASYNC_PROVIDER_JOBS:-true}
  DEPARTMENT_API_BASE_URL: http://department-api:8000
  PROVIDER_TRANSPORT_SANDBOX_VEHICLE_API_KEY: ${DEPARTMENT_API_KEY_TRANSPORT:-}
  PROVIDER_TRANSPORT_SANDBOX_LICENCE_API_KEY: ${DEPARTMENT_API_KEY_TRANSPORT:-}

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    restart: unless-stopped
    networks:
      - sangam-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep PGDATA in a versioned subdirectory of
      # /var/lib/postgresql, so the volume must be mounted there to persist.
      - sangam-postgres-data:/var/lib/postgresql
    restart: unless-stopped
    networks:
      - sangam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sangam-network

  department-api:
    build:
      context: ./backend
    environment:
      SANGAM_ENV: ${SANGAM_ENV:-development}
      DEPARTMENT_API_KEY_TRANSPORT: ${DEPARTMENT_API_KEY_TRANSPORT:-}
      DEPARTMENT_SANDBOX_AUTO_SEED: ${DEPARTMENT_SANDBOX_AUTO_SEED:-true}
      SANDBOX_DATA_DIR: /app/data/sandboxes
    volumes:
      - sangam-sandbox-data:/app/data/sandboxes
    command: ["python", "-m", "uvicorn", "app.department_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    networks:
      - sangam-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      <<: *backend-env
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-1800}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      department-api:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    restart: unless-stopped
    networks:
      - sangam-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      <<: *backend-env
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sangam-network
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped
    networks:
      - sangam-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  sangam-postgres-data:
  sangam-sandbox-data:

networks:
  sangam-network:
